name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Build only crates that cross-compile cleanly from x86_64.
      # GUI crates (asahi-gtk, asahi-trackpad-viz, asahi-gui) need native
      # GTK/GL headers for the target arch and are built by `install.sh
      # --source` on the user's machine instead.
      - name: Build CLI + TUI + daemons
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu \
            -p asahi-core \
            -p asahi-tui \
            -p kbd-backlight \
            -p battery-limiter \
            -p net-restarter \
            -p sys-monitor \
            -p asahi-battery-health \
            -p asahi-charge-daemon \
            -p asahi-power-draw \
            -p asahi-sleep-log \
            -p asahi-charge-notify \
            -p asahi-notify-hub \
            -p asahi-kernel-manager \
            -p asahi-priv-daemon

      - name: Package
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DIR="asahi-tools-${TAG}-aarch64-unknown-linux-gnu"
          mkdir -p "dist/${DIR}/bin" "dist/${DIR}/assets"
          for b in asahi-tui kbd-backlight battery-limiter net-restarter \
                   sys-monitor asahi-battery-health asahi-charge-daemon \
                   asahi-power-draw asahi-sleep-log asahi-charge-notify \
                   asahi-notify-hub asahi-kernel-manager asahi-trackpad-viz \
                   asahi-force-click asahi-priv-daemon sysmon-daemon; do
            if [ -f "target/aarch64-unknown-linux-gnu/release/${b}" ]; then
              cp "target/aarch64-unknown-linux-gnu/release/${b}" "dist/${DIR}/bin/${b}"
            fi
          done
          cp README.md LICENSE "dist/${DIR}/"
          cp -r assets/* "dist/${DIR}/assets/" 2>/dev/null || true
          cp -r scripts "dist/${DIR}/" 2>/dev/null || true
          cd dist
          tar -czf "../${DIR}.tar.gz" "${DIR}"
          cd ..
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            asahi-tools-*.tar.gz
            asahi-tools-*.tar.gz.sha256
          generate_release_notes: true
          prerelease: true
          body: |
            Pre-built binaries for **aarch64-unknown-linux-gnu**.

            **Bundled:** TUI launcher, all CLI tools, all daemons, scripts.

            **Not bundled** (build from source with `install.sh --source`):
            `asahi-gtk` (GTK4 GUI), `asahi-trackpad-viz`, `asahi-gui`.

            See [README](https://github.com/Mandrusian/asahi-tools#readme) for install instructions.
