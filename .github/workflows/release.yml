name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install aarch64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --workspace --target aarch64-unknown-linux-gnu

      - name: Package
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DIR="asahi-tools-${TAG}-aarch64-unknown-linux-gnu"
          mkdir -p "dist/${DIR}/bin"
          for b in asahi-tui kbd-backlight battery-limiter net-restarter sys-monitor sysmon-daemon; do
            cp "target/aarch64-unknown-linux-gnu/release/${b}" "dist/${DIR}/bin/${b}"
          done
          cp README.md LICENSE "dist/${DIR}/"
          cd dist
          tar -czf "../${DIR}.tar.gz" "${DIR}"
          cd ..
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            asahi-tools-*.tar.gz
            asahi-tools-*.tar.gz.sha256
          generate_release_notes: true
