name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Build ONLY the CLI tools and daemons. 
      # GTK cross-compilation is not supported in this simple runner.
      - name: Build CLI tools
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu \
            -p asahi-core \
            -p asahi-tui \
            -p asahi-battery-health \
            -p asahi-charge-daemon \
            -p asahi-charge-notify \
            -p asahi-kernel-manager \
            -p asahi-notify-hub \
            -p asahi-power-draw \
            -p asahi-priv-daemon \
            -p asahi-sensor-explorer \
            -p asahi-sleep-log \
            -p battery-limiter \
            -p kbd-backlight \
            -p net-restarter \
            -p sys-monitor

      - name: Package
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DIR="asahi-tools-${TAG}-aarch64-unknown-linux-gnu"
          mkdir -p "dist/${DIR}/bin" "dist/${DIR}/assets"
          
          for b in asahi-tui asahi-battery-health asahi-charge-daemon \
                   asahi-charge-notify asahi-kernel-manager asahi-notify-hub \
                   asahi-power-draw asahi-priv-daemon asahi-sleep-log \
                   battery-limiter kbd-backlight net-restarter sys-monitor; do
            if [ -f "target/aarch64-unknown-linux-gnu/release/${b}" ]; then
              cp "target/aarch64-unknown-linux-gnu/release/${b}" "dist/${DIR}/bin/${b}"
            fi
          done
          
          cp README.md LICENSE "dist/${DIR}/"
          cp -r assets/* "dist/${DIR}/assets/" 2>/dev/null || true
          cp -r scripts "dist/${DIR}/" 2>/dev/null || true
          
          cd dist
          tar -czf "../${DIR}.tar.gz" "${DIR}"
          cd ..
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            asahi-tools-*.tar.gz
            asahi-tools-*.sha256
          generate_release_notes: true
          prerelease: true
          body: |
            **⚠️ ALPHA RELEASE**
            
            This is an unstable alpha build. Expect rough edges.
            
            Includes: TUI launcher, CLI tools, daemons, and scripts.
            **Excludes:** `asahi-gtk` (GUI must be built from source).
